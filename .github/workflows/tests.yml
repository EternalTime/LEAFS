name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # pinned, not ubuntu-latest: no 3.8 or 3.9 build is published for the
    # newer runner images, and both versions are supported here
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # the figures typeset their text with LaTeX (see docs/conf.py)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra cm-super dvipng
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[docs]'
      - run: make -C docs html
